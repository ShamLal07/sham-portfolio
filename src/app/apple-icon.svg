<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <linearGradient id="bgApple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141724" />
      <stop offset="100%" stop-color="#08090E" />
    </linearGradient>
  </defs>

  <!-- Background rounded rectangle -->
  <rect x="0" y="0" width="180" height="180" rx="42" fill="url(#bgApple)" />

  <!-- Code bracket accents -->
  <path d="M38 72 L20 90 L38 108" stroke="#384058" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <path d="M142 72 L160 90 L142 108" stroke="#384058" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Monogram text SL centered -->
  <text x="90" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="78" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="-3">SL</text>

  <!-- Glowing live beacon dot -->
  <circle cx="145" cy="38" r="14" fill="#10B981" />
  <circle cx="145" cy="38" r="8" fill="#6EE7B7" />
</svg>
