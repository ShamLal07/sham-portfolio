<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141724" />
      <stop offset="100%" stop-color="#08090E" />
    </linearGradient>
  </defs>

  <!-- Squircle rounded container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg)" stroke="#232738" stroke-width="2.5" />

  <!-- Code bracket accents -->
  <path d="M13 25 L7 32 L13 39" stroke="#384058" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <path d="M51 25 L57 32 L51 39" stroke="#384058" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Monogram text SL centered -->
  <text x="32" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1.5">SL</text>

  <!-- Availability / Developer active beacon dot -->
  <circle cx="51" cy="13" r="5" fill="#10B981" />
  <circle cx="51" cy="13" r="3" fill="#6EE7B7" />
